<style>
/* Layout: 顶部一级菜单（概览 · 用量 · 网关 · 日志）+ 二级视角标签；一个视图只回答一个问题。
   Color: 中性做底 / 单一强调色（交互 + 单色阶数据）/ 状态色只表状态 / 8 槽分类色只给数据系列。 */
:root {
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#171816; --ink-2:#52514e; --muted:#6f6e68;
  --hair:rgba(11,11,11,.10); --grid:#e8e7e1; --base:#c3c2b7;
  --accent:#2467b6; --accent-wash:#eaf2fc; --on-accent:#ffffff;
  --good:#0ca30c; --good-tx:#006300; --good-wash:#e7f4e9;
  --warn:#fab219; --warn-tx:#7a4f00; --warn-wash:#fff4dc;
  --crit:#d03b3b; --crit-tx:#b02a2a; --crit-wash:#fdeeee;
  --c1:#4477aa; --c2:#ee6677; --c3:#228833; --c4:#ccbb44; --c5:#66ccee; --c6:#aa3377; --c7:#dd8b3a; --c8:#3148a8; --c9:#8a6d0f; --c10:#00876c; --c-other:#a3a199;
  /* Token 分类安全色（色盲友好，源自老版 /usage 8d4d030）：输入蓝 / 输出绿 / 缓存创建琥珀 / 缓存命中紫 / 成本红 */
  --tok-in:#2a78d6; --tok-out:#0b950b; --tok-cc:#bd7d00; --tok-cr:#8e7cc3; --tok-cost:#cc3131;
  --skel-a:#edece7; --skel-b:#dcdbd3;
  --h0:#eeede8; --h1:#cde2fb; --h2:#9ec5f4; --h3:#5598e7; --h4:#256abf; --h5:#104281;
  --meter:#2a78d6; --meter-track:#e7e6e0;
  --tip-bg:#20221f; --tip-fg:#fcfcfb;
  --shadow:0 1px 2px rgba(11,11,11,.04);
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --accent:#83b8fb; --accent-wash:#1c2d42; --on-accent:#0d1626;
  --good:#0ca30c; --good-tx:#3fc455; --good-wash:#173020;

  --crit:#d03b3b; --crit-tx:#f07272; --crit-wash:#3c2020;
  --c1:#6c9bd2; --c2:#f28a97; --c3:#3fae55; --c4:#d9c766; --c5:#7fd6ef; --c6:#c57bb0; --c7:#e5a45c; --c8:#7285e8; --c9:#c9a84c; --c10:#3fbf9d; --c-other:#6c6e66;
  --tok-in:#3987e5; --tok-out:#3fc455; --tok-cc:#f5b02e; --tok-cr:#b3a1f0; --tok-cost:#f06565;
  --skel-a:#24261f; --skel-b:#30332a;
  --h0:#242724; --h1:#123257; --h2:#184f95; --h3:#2a78d6; --h4:#5598e7; --h5:#9ec5f4;

}}

  --hair:rgba(255,255,255,.11); --grid:#2b2e2a; --base:#41443e;
  --accent:#83b8fb; --accent-wash:#1c2d42; --on-accent:#0d1626;
  --good:#0ca30c; --good-tx:#3fc455; --good-wash:#173020;
  --warn:#fab219; --warn-tx:#f0c66e; --warn-wash:#382d14;
  --crit:#d03b3b; --crit-tx:#f07272; --crit-wash:#3c2020;
  --c1:#6c9bd2; --c2:#f28a97; --c3:#3fae55; --c4:#d9c766; --c5:#7fd6ef; --c6:#c57bb0; --c7:#e5a45c; --c8:#7285e8; --c9:#c9a84c; --c10:#3fbf9d; --c-other:#6c6e66;

  --tip-bg:#343831; --tip-fg:#f3f4ef; --shadow:none; color-scheme:dark;
}
* { box-sizing:border-box; }
body { background:var(--page); color:var(--ink); font:14px/1.5 var(--font); }
.shell { max-width:1180px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
main.shell { padding-block:0 48px; }
a { color:var(--accent); }
button { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

/* ── 顶栏 ── */
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--page); }
.topbar { position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--page); border-bottom:1px solid var(--hair); }
.topbar-in { display:flex; align-items:center; gap:24px; min-height:56px; }
.brand { font-weight:650; letter-spacing:.01em; white-space:nowrap; display:flex; align-items:center; gap:8px; color:inherit; text-decoration:none; }
.brand-mark { width:36px; height:36px; border-radius:9px; flex:none; display:block; object-fit:contain; }
.nav1 { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0; }
.nav1 a { text-decoration:none; color:var(--ink-2); padding:6px 12px; border-radius:8px; white-space:nowrap; display:flex; align-items:center; gap:6px; }
.nav1 a:hover { background:var(--accent-wash); color:var(--ink); }
.nav1 a[aria-current="page"] { color:var(--ink); font-weight:600; background:var(--surface); box-shadow:inset 0 0 0 1px var(--hair); }
.count { font-size:11px; font-weight:650; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--accent); color:var(--on-accent); display:inline-grid; place-items:center; }
.tools { display:flex; align-items:center; gap:8px; }
.icon-btn { width:32px; height:32px; display:grid; place-items:center; padding:0; border-radius:8px; border:1px solid var(--hair); background:var(--surface); cursor:pointer; }
.icon-btn:hover { background:var(--accent-wash); }
.icon-btn svg { width:16px; height:16px; }
.proto-tag { font-size:11px; color:var(--muted); border:1px dashed var(--base); border-radius:6px; padding:2px 6px; white-space:nowrap; }
.mark { position:relative; display:inline-flex; align-items:center; border:0; background:none; padding:0 1px; cursor:help; color:var(--muted); }
.mark svg { width:13px; height:13px; display:block; }
.mark .pop { display:none; position:absolute; top:calc(100% + 7px); left:0; z-index:60; width:236px; max-width:calc(100vw - 24px); padding:10px 12px; border-radius:8px; background:var(--surface); border:1px solid var(--hair); box-shadow:0 10px 28px rgba(0,0,0,.16); font-size:12px; line-height:1.65; color:var(--ink-2); text-align:left; font-weight:400; white-space:normal; pointer-events:none; }
.mark:hover .pop, .mark:focus-visible .pop { display:block; }
.mark .pop b.tt { display:block; margin-bottom:3px; color:var(--ink); font-weight:650; }
.probe-btn { border:1px solid var(--hair); background:var(--surface); color:var(--ink-2); border-radius:6px; font-size:11px; padding:2px 8px; cursor:pointer; }
.probe-btn:hover { border-color:var(--accent); color:var(--accent); }
.probe-btn:disabled { opacity:.55; cursor:default; }
.u-filters .probe-btn { min-height:28px; display:inline-flex; align-items:center; } /* 与 seg/下拉等高；anchor 需 inline-flex 才能竖直居中 */
.probe-btn.cta { background:var(--accent); color:var(--on-accent); border-color:transparent; font-weight:600; } /* 功能动作钮（如「查看日志」）：主色实底，与中性按钮区分（同 .btn.primary 令牌） */
.probe-btn.cta:hover { filter:brightness(1.08); border-color:transparent; color:var(--on-accent); }
.icon-btn.is-loading svg { animation:c-spin .9s linear infinite; }
.icon-btn.is-success { border-color:var(--good-tx); color:var(--good-tx); }
.icon-btn.is-success .fb-check { stroke-dasharray:1; stroke-dashoffset:0; animation:c-check .3s cubic-bezier(.16,1,.3,1); }
.icon-btn.is-error { border-color:var(--crit-tx); color:var(--crit-tx); }
.icon-btn:disabled { opacity:.7; cursor:default; }
@keyframes c-spin { to { transform:rotate(360deg); } }
@keyframes c-check { from { stroke-dashoffset:1; } to { stroke-dashoffset:0; } }
.auto-btn { font-size:12px; border:1px solid var(--hair); border-radius:999px; padding:4px 10px; background:var(--surface); color:var(--ink-2); cursor:pointer; white-space:nowrap; }
.auto-btn.on { color:var(--ink); }
.auto-btn.on::before { content:"●"; font-size:8px; color:var(--good-tx); margin-right:5px; vertical-align:1px; }
.u-filters { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.u-filters label { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:600; }
.u-filters select { font-weight:600; }
.u-filters select hr { border:none; border-top:1px dashed var(--hair); margin:4px 6px; } /* 来源分组分割线：淡虚线 */
.u-hero-grid { display:grid; grid-template-columns:minmax(170px,1.25fr) minmax(130px,1fr) minmax(300px,2fr); align-items:center; }
.u-primary { display:grid; gap:4px; padding-right:22px; min-width:0; }
.u-primary + .u-primary { border-left:1px solid var(--hair); padding-left:22px; }
.u-xl { font-size:clamp(24px, 2.3vw, 30px); font-weight:700; letter-spacing:-.02em; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.u-primary.cost .u-xl { color:var(--tok-cost); }
.u-mini-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px 26px; border-left:1px solid var(--hair); padding-left:22px; }
.u-mini { display:grid; gap:3px; min-width:0; }
.u-mid { font-size:16px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.u-mini.ok .u-mid { color:var(--good-tx); }
.u-mini.warn .u-mid { color:var(--warn-tx); }
@media (max-width: 1000px) {
  .u-hero-grid { grid-template-columns:1fr 1fr; }
  .u-mini-grid { grid-column:1 / -1; border-left:0; padding-left:0; border-top:1px solid var(--hair); margin-top:12px; padding-top:12px; grid-template-columns:repeat(4, minmax(0,1fr)); }
}
@media (max-width: 620px) {
  .u-hero-grid { grid-template-columns:1fr; }
  .u-primary + .u-primary { border-left:0; padding-left:0; border-top:1px solid var(--hair); padding-top:12px; }
  .u-mini-grid { grid-template-columns:repeat(2, minmax(0,1fr)); }
}
.u-label { font-size:12px; color:var(--muted); }
.u-label .mark { vertical-align:middle; }
.u-tile .u-big { font-size:clamp(18px, 1.8vw, 23px); font-weight:680; letter-spacing:-.015em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.u-tile.cost .u-big { color:var(--tok-cost); }
.u-tile.ok .u-big { color:var(--good-tx); }
.u-tile.warn .u-big { color:var(--warn-tx); }
.u-sub { font-size:12px; color:var(--muted); }
.u-mix { margin-top:14px; padding-top:12px; border-top:1px dashed var(--hair); }
.chart-wrap svg { display:block; width:100%; height:auto; }
.u-legend { display:flex; gap:6px 14px; flex-wrap:wrap; margin-bottom:8px; }
.u-legend button { display:inline-flex; align-items:center; gap:5px; font:inherit; font-size:12px; border:none; background:none; color:var(--ink-2); cursor:pointer; padding:2px 6px; border-radius:6px; }
.u-legend button:hover { background:var(--accent-wash); }
.u-legend button.off { opacity:.42; }
.u-legend button:disabled { cursor:default; opacity:.3; }
.u-legend i { width:10px; height:10px; border-radius:3px; display:inline-block; }
.u-legend em { font-style:normal; }
.u-legend b { font-weight:600; font-variant-numeric:tabular-nums; color:var(--muted); }
.u-legend svg { vertical-align:middle; }
.u-src-row { display:flex; gap:8px 14px; flex-wrap:wrap; align-items:center; }
.u-src-row + .u-src-row { margin-top:4px; }
.u-grp { font-size:11px; color:var(--muted); border:1px solid var(--hair); border-radius:999px; padding:1px 8px; flex:none; min-width:56px; display:inline-flex; justify-content:center; }

/* ── 二级标签 ── */
.headbar { display:flex; justify-content:flex-end; align-items:center; padding-top:18px; }
.tabs-row { display:flex; align-items:flex-end; gap:12px; margin-top:16px; border-bottom:1px solid var(--hair); overflow-x:auto; scrollbar-width:none; }
.tabs-row .tabs2 { margin-top:0; border-bottom:0; flex:1; min-width:0; }
.tabs-row .seg { margin-bottom:7px; flex:none; }
.tabs2 { display:flex; gap:2px; border-bottom:1px solid var(--hair); margin-top:16px; overflow-x:auto; scrollbar-width:none; position:relative; }
.tabs2 a { text-decoration:none; color:var(--ink-2); padding:8px 12px 10px; margin-bottom:-1px; white-space:nowrap; display:flex; gap:6px; align-items:center; position:relative; z-index:1; }
.tabs2 a:hover { color:var(--ink); }
.tabs2 a[aria-current="page"] { color:var(--ink); font-weight:600; }

/* ── 控件 ── */
.seg { display:inline-flex; background:var(--meter-track); border-radius:8px; padding:2px; gap:2px; position:relative; }
.seg button { border:0; background:transparent; padding:4px 10px; border-radius:6px; cursor:pointer; color:var(--ink-2); font-size:13px; white-space:nowrap; position:relative; z-index:1; }
.seg button[aria-pressed="true"] { color:var(--ink); font-weight:600; }
.sl-pill { position:absolute; left:0; top:0; bottom:0; z-index:0; pointer-events:none; border-radius:8px; transition:transform .3s cubic-bezier(.3,.7,.3,1), width .3s cubic-bezier(.3,.7,.3,1); }
.tabs2 > .sl-pill { background:var(--accent); top:auto; bottom:0; height:2px; border-radius:2px; }
.seg > .sl-pill { background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.12); border-radius:6px; top:2px; bottom:2px; }
.controls { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.controls select { margin-left:auto; }
select { font:inherit; min-height:28px; max-width:100%; border:1px solid var(--hair); border-radius:6px; padding:4px 8px; background:var(--surface); color:var(--ink); font-size:12px; line-height:1.2; transition:border-color .15s ease,box-shadow .15s ease; }
select:hover,select:open { border-color:color-mix(in srgb,var(--accent) 55%,var(--hair)); }
select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
@supports(appearance:base-select) {
  select,select::picker(select) { appearance:base-select; }
  select { gap:8px; display:inline-flex; align-items:center; }
  select::picker-icon { width:12px; color:var(--muted); transition:rotate .18s ease; }
  select:open::picker-icon { rotate:180deg; }
  select::picker(select) { padding:4px; margin-top:5px; border:1px solid var(--hair); border-radius:8px; background:var(--surface); color:var(--ink); box-shadow:0 6px 18px #0002; max-width:calc(100vw - 24px); max-height:min(360px,60vh); overflow:auto; opacity:0; transform:translateY(-3px); transition:opacity .15s ease,transform .15s ease,display .15s allow-discrete,overlay .15s allow-discrete; }
  select:open::picker(select) { opacity:1; transform:translateY(0); }
  @starting-style { select:open::picker(select) { opacity:0; transform:translateY(-3px); } }
  select option { border-radius:5px; min-height:30px; padding:6px 9px; font-size:12px; overflow-wrap:anywhere; white-space:normal; cursor:pointer; }
  select option:hover,select option:focus { background:color-mix(in srgb,var(--accent) 9%,var(--surface)); outline:none; }
  select option:checked { color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,var(--surface)); font-weight:600; }
  select option::checkmark { color:var(--accent); order:1; margin-left:auto; }
}
.ctl-label { font-size:12px; color:var(--muted); margin-right:6px; }

/* ── 卡片与网格 ── */
.view { display:grid; gap:16px; margin-top:20px; }
.card { background:var(--surface); border:1px solid var(--hair); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow); min-width:0; }
.card-h { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.card-h h2 { margin:0; font-size:15px; font-weight:650; }
.card-h .meta { color:var(--muted); font-size:12px; }
.grid-2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap:16px; }
.grid-4 { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap:16px; }
.grid-3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap:16px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap:1px; background:var(--hair); border:1px solid var(--hair); border-radius:12px; overflow:hidden; }
.tile { background:var(--surface); padding:14px 16px; min-width:0; }
.tile .k { font-size:12px; color:var(--muted); }
.tile .v { font-size:22px; font-weight:650; margin-top:2px; white-space:nowrap; }
.tile-sub { font-size:12px; color:var(--muted); font-weight:500; }
.tile .s { font-size:12px; color:var(--ink-2); margin-top:2px; }
.num { font-variant-numeric:tabular-nums; }

/* ── 状态 ── */
.chip { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:550; padding:1px 8px; border-radius:999px; white-space:nowrap; background:var(--meter-track); color:var(--ink-2); }
.chip svg { width:12px; height:12px; }
.chip.good { background:var(--good-wash); color:var(--good-tx); }
.chip.warn { background:var(--warn-wash); color:var(--warn-tx); }
.chip.crit { background:var(--crit-wash); color:var(--crit-tx); }
.chip.info { background:var(--accent-wash); color:var(--accent); }
.chip.ghost { background:transparent; box-shadow:inset 0 0 0 1px var(--hair); }
.alerts { display:grid; gap:8px; }

.alert { display:flex; gap:10px; align-items:flex-start; padding:10px 14px; border-radius:10px; border:1px solid var(--hair); background:var(--surface); }
.alert svg { width:16px; height:16px; flex:none; margin-top:2px; }
.alert.crit { background:var(--crit-wash); border-color:transparent; } .alert.crit svg { color:var(--crit); }
.alert.warn { background:var(--warn-wash); border-color:transparent; } .alert.warn svg { color:var(--warn-tx); }
.alert.info svg { color:var(--accent); }
.alert b { font-weight:600; }
.alert .act { margin-left:auto; white-space:nowrap; }
.alink { display:inline-flex; align-items:center; gap:3px; padding:3px 11px; border-radius:999px; background:var(--accent-wash); color:var(--accent); font-size:12.5px; font-weight:600; text-decoration:none; white-space:nowrap; transition:background .15s ease, color .15s ease; }
.alink:hover { background:var(--accent); color:var(--on-accent); }

/* ── 额度卡 ── */
.quota { display:grid; gap:12px; grid-template-rows:auto 1fr auto; align-content:stretch; }
.q-body { min-height:112px; display:grid; gap:12px; align-content:start; }
.q-body > .meter:only-child { height:100%; display:flex; flex-direction:column; justify-content:space-between; }
.q-body > .meter:only-child .meter-row .pct { font-size:18px; }
.q-head { display:flex; align-items:center; gap:11px; }
.q-head .prov-logo { width:32px; height:32px; border-radius:9px; }
.q-head .mark { vertical-align:1px; }
.q-head .mark svg { width:15px; height:15px; }
/* 状态 chip 与渠道名称行同高（顶部对齐名称行，不随两行文本块居中） */
.q-head .chip { margin-left:auto; align-self:flex-start; margin-top:1px; }
.mono-badge { width:28px; height:28px; border-radius:7px; display:grid; place-items:center; font-weight:700; font-size:12px; color:var(--surface); background:var(--ink); flex:none; }
.q-name { font-weight:600; }
.q-plan { font-size:12px; color:var(--muted); }
.q-head .chip { margin-left:auto; }

  const r = rows.find((x) => (x.key ?? null) === key);
  if (r) row.insertAdjacentHTML('afterend', breakdownDetail(r, isSrc, period, isSrc ? srcColor : modelColor));
}

let provOfModel = new Map();
function rebuildProvOfModel() {
  const m = new Map();
  for (const p of S.providers) for (const mod of p.models) { if (!m.has(mod.id)) m.set(mod.id, mod.chain?.[0]?.providerId ?? p.id); }

}
/* ── 用量 · 渠道：复刻老 /usage 用量统计页 —— 筛选 + 汇总卡 + 用量/成本双刻度图 + 来源折线图 ── */
const U = { data: null, loading: false, error: '', prov: '', client: '', model: '', range: '7d', hidden: new Set(), srcHidden: new Set(), agents: {}, lastFocus: null };
let U_RANGE;
labelUpdates.push(() => { U_RANGE = { today: t('今天'), yday: t('昨天'), '7d': t('近7天'), '30d': t('近30天') }; });
labelUpdates.at(-1)();
let U_SERIES;
labelUpdates.push(() => { U_SERIES = [
  { k: 'out', key: 'output', label: t('输出'), color: 'var(--tok-out)' },
  { k: 'in', key: 'input', label: t('输入'), color: 'var(--tok-in)' },
  { k: 'cc', key: 'cacheWrite', label: t('缓存创建'), color: 'var(--tok-cc)' },
  { k: 'cr', key: 'cacheRead', label: t('缓存命中'), color: 'var(--tok-cr)' },
]; });
labelUpdates.at(-1)();
const uWan = (n) => { if (MGI18n.lang === 'en') return MGI18n.fmtCompact(n); return (n >= 10000 ? (n / 10000).toFixed(1) + ' 万' : String(Math.round(n))); };
const uBucketLabel = (iso, unit) => { const d = new Date(iso); return unit === 'hour' ? `${pad(d.getHours())}:00` : MGI18n.fmtDate(d); };
function uNiceCeil(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const u = v / p; return (u <= 1 ? 1 : u <= 2 ? 2 : u <= 4 ? 4 : u <= 5 ? 5 : u <= 8 ? 8 : 10) * p; }

async function loadU() {
  U.loading = true;
  const q = new URLSearchParams({ range: U.range, logLimit: '50' });
  if (U.prov) q.set('provider', U.prov);
  if (U.model) q.set('model', U.model);
  if (U.client) q.set('client', U.client);
  if (state.kind === 'served' || state.kind === 'observed') q.set('kind', state.kind);
  try {
    const d = await fetchJson('/internal/usage?' + q);
    if (d.enabled === false || !d.totals || !Array.isArray(d.buckets)) throw Object.assign(new Error(), { usageDisabled: true });
    for (const [k, v] of Object.entries(d.modelNames ?? {})) MODEL_NAMES.set(k, v);
    // 联动：切换 kind/渠道后，已选项可能不在新的可选集里（如订阅直连无智谱）→ 自动清空并重拉，避免空数据死等
    const fp = d.filters?.providers ?? [], fm = d.filters?.models ?? [];
    if (U.prov && !fp.some((x) => x.id === U.prov)) { U.prov = ''; U.data = d; U.loading = false; return loadU(); }
    if (U.model && !fm.some((x) => (x.id ?? x) === U.model)) { U.model = ''; U.data = d; U.loading = false; return loadU(); }
    const fcl = d.filters?.clients ?? [];
    if (U.client && !fcl.includes(U.client)) { U.client = ''; U.data = d; U.loading = false; return loadU(); }
    U.data = d; U.error = '';
    U.agents = Object.fromEntries((d.agents ?? []).map((a) => [a.app, a]));
  } catch (e) { U.error = e.usageDisabled ? 'usage-disabled' : e.message; }
  U.loading = false;
  if (currentView() === 'usage-channels') { render(); requestAnimationFrame(drawU); }
}

/* 双刻度堆叠面积图：左轴 Tokens（输出→输入→缓存创建→缓存命中自下而上堆叠），右轴成本虚线 */
function drawUTrend() {
  const svg = document.querySelector('#u-chart');
  if (!svg || !U.data) return;
  const buckets = U.data.buckets, unit = U.data.unit;
  if (!buckets.length) { svg.innerHTML = ''; svg.parentElement.querySelector('.u-empty')?.remove(); svg.insertAdjacentHTML('afterend', `<p class="muted u-empty" style="font-size:12px;margin:6px 0 0">${t('这个筛选范围没有数据')}</p>`); return; }
  const W = Math.max(240, Math.round(svg.parentElement.clientWidth || 1040)), H = W < 500 ? 280 : 210, R = 56, T = 16, B = 44;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const maxTok0 = uNiceCeil(Math.max(...buckets.map((b) => U_SERIES.reduce((s2, x) => s2 + (b[x.key] || 0), 0)), 1));
  const L = Math.max(W < 500 ? 52 : 60, ...Array.from({ length: 5 }, (_, i) => [...uWan(maxTok0 * (1 - i / 4))].reduce((w, ch) => w + (ch.charCodeAt(0) > 255 ? 10.5 : 6.5), 0) + 14));
  const iw = W - L - R, ih = H - T - B, n = Math.max(buckets.length, 2);
  const vis = U_SERIES.filter((s) => !U.hidden.has(s.k));
  const maxTok = uNiceCeil(Math.max(...buckets.map((b) => vis.reduce((s2, x) => s2 + (b[x.key] || 0), 0)), 1));
  const maxCost = uNiceCeil(Math.max(...buckets.map((b) => b.cost), 0.0001));
  const X = (i) => L + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
  const Yt = (v) => T + ih - (v / maxTok) * ih;
  const Yc = (v) => T + ih - (v / maxCost) * ih;
  let acc = buckets.map(() => 0), vacc = buckets.map(() => T + ih);
  const layerPath = (vals) => {
    const top = vals.map((v, i) => acc[i] + v);
    const yTop = top.map((v, i) => (vals[i] > 0 ? Math.max(T, Math.min(Yt(v), vacc[i] - 3)) : vacc[i]));
    const m = yTop.length;
    const d = yTop.map((y, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${y.toFixed(1)}`).join('') +
      yTop.map((_, ri) => { const i = m - 1 - ri; return `L${X(i).toFixed(1)},${vacc[i].toFixed(1)}`; }).join('') + 'Z';
    acc = top; vacc = yTop;
    return d;
  };
  const costPath = buckets.map((b, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Yc(b.cost).toFixed(1)}`).join('');
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const y = T + (ih * i) / 4, vTok = maxTok * (1 - i / 4), vCost = maxCost * (1 - i / 4);
    g += `<line x1="${L}" y1="${y.toFixed(1)}" x2="${W - R}" y2="${y.toFixed(1)}" stroke="var(--hair)" stroke-width="1"/>`;
    g += `<text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${uWan(vTok)}</text>`;
    g += `<text x="${W - R + 8}" y="${y + 4}" font-size="11" fill="var(--muted)">${uCostUnknown() ? '—' : '$' + (vCost >= 1 ? vCost.toFixed(1) : vCost > 0 && vCost < 0.1 ? vCost.toFixed(3) : vCost.toFixed(2))}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 85))));
  for (let i = 0; i < buckets.length; i += step) g += `<text x="${X(i).toFixed(1)}" y="${H - B + 18}" text-anchor="middle" font-size="11" fill="var(--muted)">${uBucketLabel(buckets[i].t, unit)}</text>`;
  svg.innerHTML = `${g}
    ${vis.filter((s) => buckets.some((b) => (b[s.key] || 0) > 0)).map((s, si) => { const d = layerPath(buckets.map((b) => b[s.key] || 0)); const gid = `ug-${s.k}`; return `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".5"/><stop offset="1" stop-color="${s.color}" stop-opacity=".2"/></linearGradient></defs><path d="${d}" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.6"/>`; }).join('')}
    ${U.hidden.has('cost') || uCostUnknown() ? '' : `<path d="${costPath}" fill="none" stroke="var(--tok-cost)" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>`}
    <line class="u-rule" y1="${T}" y2="${T + ih}" stroke="var(--accent)" stroke-width="1" opacity="0"/>`;
  const rule = svg.querySelector('.u-rule');
  const show = (e) => {
    const r = svg.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * W;
    if (px < L || px > W - R) return;
    const i = Math.min(buckets.length - 1, Math.max(0, Math.round(((px - L) / iw) * (n - 1))));
    rule.setAttribute('x1', X(i)); rule.setAttribute('x2', X(i)); rule.setAttribute('opacity', '.6');
    const b = buckets[i];
    const dot = (c) => `<i style="background:${c}"></i>`;
    showTip(e, `<div class="tt">${t('{v1} · {v2} 次请求', { v1: uBucketLabel(b.t, unit), v2: b.usageOnly ? (b.requests ? fmtInt(b.requests) + t('（部分）') : '—') : fmtInt(b.requests ?? 0) })}</div>` +
      `<div class="tr"><span>${t('{v1}输入', { v1: dot('var(--tok-in)') })}</span><b>${fmtInt(b.input || 0)}</b></div>` +
      `<div class="tr"><span>${t('{v1}输出', { v1: dot('var(--tok-out)') })}</span><b>${fmtInt(b.output || 0)}</b></div>` +
      `<div class="tr"><span>${t('{v1}缓存创建', { v1: dot('var(--tok-cc)') })}</span><b>${fmtInt(b.cacheWrite || 0)}</b></div>` +
      `<div class="tr"><span>${t('{v1}缓存命中', { v1: dot('var(--tok-cr)') })}</span><b>${fmtInt(b.cacheRead || 0)}</b></div>` +
      `<div class="tr"><span>${t('成本')}</span><b>${uCostUnknown() ? '—' : '$' + (b.cost || 0).toFixed(6)}</b></div>`);
  };
  svg.onpointermove = (e) => { if (e.pointerType === 'mouse') show(e); };
  svg.onpointerdown = show;
  svg.onpointerleave = () => { hideTip(); rule?.setAttribute('opacity', '0'); };
}

/* 来源折线图：上 Agent 下业务两图区共享 X 轴，各自独立 Y 轴 */
function uClassify() {
  const agents = [], business = []; let exU = 0, exS = 0;
  for (const c of U.data?.clients ?? []) {
    if (c.client === 'shared') { exS += c.total.tokens; continue; }
    if (!c.client) { exU += c.total.tokens; continue; }
    if (!(c.total.requests > 0 || c.total.tokens > 0)) continue;
    ((U.agents[c.client] ?? AGENTS[c.client]) ? agents : business).push(c);
  }

function drawUSource() {
  const svg = document.querySelector('#src-chart');
  if (!svg || !U.data) return;
  const cls = uClassify();
  const cmap = uSrcColors(cls);
  const scol = (c) => cmap.get(c) ?? 'var(--c-other)';
  const vis = (list) => list.filter((c) => !U.srcHidden.has(c.client));
  const agV = vis(cls.agents), bzV = vis(cls.business);
  const fmtSrc = (v) => { if (MGI18n.lang === 'en') return MGI18n.fmtCompact(v); return (v >= 1e8 ? (v / 1e8).toFixed(2) + ' 亿' : v >= 1e4 ? (v / 1e4).toFixed(2) + ' 万' : String(Math.round(v))); };
  const W = Math.max(240, Math.round(svg.parentElement.clientWidth || 1040)), H = W < 500 ? 400 : 270, R = 12;
  const maxima = [agV, bzV].map((list) => uNiceCeil(Math.max(...list.flatMap((s) => s.buckets.map((b) => b.tokens ?? 0)), 1)));
  const ticks = maxima.map((max) => { const steps = Math.min(4, max); return Array.from({ length: steps + 1 }, (_, i) => max * (1 - i / steps)); });
  const L = Math.max(40, ...ticks.flat().map((v) => [...fmtSrc(v)].reduce((w, ch) => w + (ch.charCodeAt(0) > 255 ? 10.5 : 6.5), 0) + 14));
  const T1 = 26, H1 = (H - 96) / 2, T2 = T1 + H1 + 40, H2 = H1, timeY = H - 8;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const iw = W - L - R;
  const ref = agV[0]?.buckets ?? bzV[0]?.buckets ?? [];
  const n = Math.max(ref.length, 2);
  const X = (i) => L + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
  let g = '';
  const pane = (T, Hh, list, max, label, tickList) => {
    const Y = (v) => T + Hh - (v / max) * Hh;
    for (const tv of tickList) { const y = Y(tv); g += `<line x1="${L}" y1="${y.toFixed(1)}" x2="${W - R}" y2="${y.toFixed(1)}" stroke="var(--hair)" ${tv === 0 ? '' : 'opacity=".45"'}/><text x="${L - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtSrc(tv)}</text>`; }
    const sum = list.reduce((a, s) => a + (s.total.tokens || 0), 0);
    g += `<text x="${L}" y="${T - 12}" font-size="11" font-weight="650" fill="var(--muted)">${label}</text>`;
    if (sum > 0) g += `<text x="${W - R}" y="${T - 12}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtTok(sum)}</text>`;
    if (!list.length) g += `<text x="${(L + W - R) / 2}" y="${T + Hh / 2}" text-anchor="middle" font-size="12" fill="var(--muted)">${t('窗口内无{v1}来源用量', { v1: label })}</text>`;
    list.forEach((s, si) => {
      const pts = s.buckets.map((b, bi) => [X(bi), Y(b.tokens ?? 0)]);
      if (pts.length < 2) return;
      const d = pts.map(([px, py], j) => `${j ? 'L' : 'M'}${px.toFixed(1)},${py.toFixed(1)}`).join('');
      const peak = Math.max(...s.buckets.map((b) => b.tokens ?? 0));
      const color = scol(s.client);
      if (peak >= max * 0.05) { const fid = `sf-${T}-${si}`; g += `<defs><linearGradient id="${fid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity=".02"/></linearGradient></defs><path d="${d}L${pts[pts.length - 1][0].toFixed(1)},${(T + Hh).toFixed(1)}L${pts[0][0].toFixed(1)},${(T + Hh).toFixed(1)}Z" fill="url(#${fid})"/>`; }
      g += `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>`;
    });
  };
  pane(T1, H1, agV, maxima[0], 'Agent', ticks[0]);
  pane(T2, H2, bzV, maxima[1], t('业务'), ticks[1]);
  const unit = U.data.unit;
  const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 85))));
  for (let i = 0; i < ref.length; i += step) g += `<text x="${X(i).toFixed(1)}" y="${timeY}" text-anchor="middle" font-size="11" fill="var(--muted)">${uBucketLabel(ref[i].t, unit)}</text>`;
  svg.innerHTML = `${g}<line class="u-rule" x1="0" x2="0" y1="${T1}" y2="${T2 + H2}" stroke="var(--accent)" stroke-width="1" opacity="0"/>`;
  /* hover：竖线 + 分来源数值 tip（与「使用趋势」同机制；触屏点按也可）。
 *  2026-11-04 修复：此前只画线不挂 pointer，悬停无任何数据展示 */
  if (!ref.length) return;
  const rule = svg.querySelector('.u-rule');
  const srcName = (c) => U.agents[c]?.label ?? AGENTS[c]?.label ?? srcLabel(c);
  const show = (e) => {
    const r = svg.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * W;
    if (px < L - 4 || px > W - R + 4) { hideTip(); rule.setAttribute('opacity', '0'); return; }
    const i = Math.min(ref.length - 1, Math.max(0, Math.round(((px - L) / iw) * (n - 1))));
    rule.setAttribute('x1', X(i)); rule.setAttribute('x2', X(i)); rule.setAttribute('opacity', '.6');
    // 只列可见曲线（图例可显隐）且该桶有值的来源，按用量降序；超过 9 个折叠尾部
    const rows = [...agV, ...bzV]
      .map((s) => ({ name: srcName(s.client), color: scol(s.client), v: s.buckets[i]?.tokens ?? 0 }))
      .filter((x) => x.v > 0).sort((a, b) => b.v - a.v);
    const total = rows.reduce((a, x) => a + x.v, 0);
    const dot = (c) => `<i style="background:${c}"></i>`;
    const top = rows.slice(0, 9);
    const restV = rows.slice(9).reduce((a, x) => a + x.v, 0);
    showTip(e, `<div class="tt">${t('{v1} · 合计 {v2}', { v1: uBucketLabel(ref[i].t, unit), v2: fmtTok(total) })}</div>` +
      (top.length ? top.map((x) => `<div class="tr"><span>${dot(x.color)}${esc(x.name)}</span><b>${fmtTok(x.v)}</b></div>`).join('') : `<div class="tr"><span class="muted">${t('该时段无来源用量')}</span></div>`) +
      (rows.length > 9 ? `<div class="tr"><span class="muted">${t('…其余 {v1} 个来源', { v1: rows.length - 9 })}</span><b>${fmtTok(restV)}</b></div>` : ''));
  };
  svg.onpointermove = (e) => { if (e.pointerType === 'mouse') show(e); };
  svg.onpointerdown = show;
  svg.onpointerleave = () => { hideTip(); rule?.setAttribute('opacity', '0'); };
}

document.addEventListener('click', (e) => {
  // 占比卡片 → 来源/模型视角：跳转前把目标视角的时间档对齐到链接标注的时段（近 30 天）
  const plink = e.target.closest('a[data-sync-period]');
  if (plink) { const [k, v] = plink.dataset.syncPeriod.split(':'); state[k] = v === 'all' ? 'all' : +v; save(); }
  const b = e.target.closest('[data-seg] button');
  if (b) { const k = b.parentElement.dataset.seg; const v = b.dataset.v;
    if (k === 'uRange') { U.range = v; U.data = null; loadU(); return; }
    if (k === 'kind') { state.kind = v; save(); LG.data = null; if (currentView() === 'usage-channels') { U.data = null; loadU(); return; } if (currentView() === 'logs-requests') { loadLG(); return; } render(); return; }
    state[k] = /^\d+$/.test(v) ? Number(v) : v; save(); render(); return; }
  const ucl = e.target.closest('[data-ufclear]'); if (ucl) { U.prov = ''; U.client = ''; U.model = ''; U.data = null; loadU(); return; }
  const uk = e.target.closest('[data-uk]'); if (uk) { const k = uk.dataset.uk; U.hidden.has(k) ? U.hidden.delete(k) : U.hidden.add(k); const lg = document.querySelector('#main .u-legend'); if (lg) lg.innerHTML = uLegendHtml(); drawUTrend(); return; }
  const us = e.target.closest('[data-usrc]'); if (us) { const c = us.dataset.usrc; U.srcHidden.has(c) ? U.srcHidden.delete(c) : U.srcHidden.add(c); const lg = document.querySelector('#main .u-src-legend'); if (lg) lg.innerHTML = uSrcLegendHtml(uClassify()); drawUSource(); return; }
  const pb = e.target.closest('[data-prov]'); if (pb) { state.catalogProv = pb.dataset.prov || null; save(); render(); return; }
  const h = e.target.closest('[data-hide]'); if (h) { const k = h.dataset.hide; hidden.has(k) ? hidden.delete(k) : hidden.add(k); store.set('hidden', [...hidden]); if (currentView() === 'usage-trends') { drawTrends(); h.setAttribute('aria-pressed', String(!hidden.has(k))); } else render(); return; }
  const row = e.target.closest('tr.row'); if (row) { toggleBreakdownRow(row); return; }
  const act = e.target.closest('[data-act]'); if (act) { openConfirm(act.dataset.id, act.dataset.act); return; }
  const probe = e.target.closest('[data-probe]'); if (probe) { probeClick(probe); return; }
  const rbBtn = e.target.closest('[data-rollback]'); if (rbBtn) { rbBtn.disabled = true; rbBtn.textContent = t('回滚中…'); fetch('/internal/inbox/rollback', { method: 'POST', headers: { 'content-type': 'application/json', 'x-inbox-csrf': INBOX.csrf }, body: '{}' }).then((r) => r.json()).then(async (d) => { if (d.error) { rbBtn.textContent = t('失败：') + d.error; return; } await simulateRefresh(false, 'all'); }).catch((err) => { rbBtn.textContent = t('失败：') + err.message; }); return; }
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr.row')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape') document.querySelector('.modal-bg')?.remove(); });
/* 主题三态：auto（跟随系统）→ light → dark；按钮 icon/提示随态更新，系统切换实时跟随（对齐老版 common.js applyTheme） */
const THEME_SVG = {
  auto: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>',
  light: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>',
  dark: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
};
let THEME_TIP;
labelUpdates.push(() => { THEME_TIP = { auto: t('主题：跟随系统（点击切换）'), light: t('主题：浅色（点击切换）'), dark: t('主题：深色（点击切换）') }; });
labelUpdates.at(-1)();
const themeMq = matchMedia('(prefers-color-scheme: dark)');
const applyTheme = () => {
  const t = store.get('theme', null);
  const mode = t === 'light' || t === 'dark' ? t : 'auto';
  if (mode === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = mode;
  const btn = $('#theme');
  btn.innerHTML = THEME_SVG[mode]; btn.title = THEME_TIP[mode]; btn.setAttribute('aria-label', THEME_TIP[mode]);
};
$('#theme').addEventListener('click', () => {
  const t = store.get('theme', null);
  const cur = t === 'light' || t === 'dark' ? t : 'auto';
  const next = { auto: 'light', light: 'dark', dark: 'auto' }[cur];
  store.set('theme', next === 'auto' ? null : next);
  applyTheme(); render();
});
themeMq.addEventListener('change', () => { applyTheme(); });
applyTheme();
function updateChrome() {
  document.documentElement.lang = MGI18n.lang;
  document.title = t('Model Gateway 控制台');
  $('.brand').setAttribute('aria-label', t('回到概览'));
  $('#nav1').setAttribute('aria-label', t('主导航'));
  $('#auto-btn').title = t('点击暂停 / 恢复自动刷新');
  $('#live-tag').title = t('自动刷新于');
  if (S) markLive(); else $('#live-tag').textContent = t('实时');
  const button = $('#language');
  button.textContent = t('中 / EN');
  button.title = t('切换语言');
  button.setAttribute('aria-label', t('切换语言'));
  updateAutoBtn();
  applyTheme();
}
$('#language').addEventListener('click', () => MGI18n.setLang(MGI18n.lang === 'zh' ? 'en' : 'zh'));
MGI18n.onLang(() => {
  for (const update of labelUpdates) update();
  // Dismiss stale confirmation text; the current view keeps its filters and data.
  document.querySelector('.modal-bg')?.remove();
  updateChrome();
  render(); // Stops topology before rebuilding it with the selected labels.
});
updateChrome();
addEventListener('hashchange', () => {
  // 渠道页「查看日志」跳转定位：锚点仅在真实导航时采纳一次；渲染路径不重放，避免手动筛选被残留锚点覆盖；
  // all = 渠道页未选渠道 → 明确重置为全部日志（区别于子页签普通切页的保留筛选）
  if (currentView() === 'logs-requests') {
    const f = hashParam();
    if (f === 'all') { if (LG.prov) { LG.prov = ''; LG.data = null; loadLG(); } }
    else if (f && f !== LG.prov) { LG.prov = f; LG.data = null; loadLG(); }
  }
  render(); startAutoRefresh();
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { repositionPills(); const v = currentView(); if (v === 'usage-summary') drawHeat(false); if (v === 'usage-trends') drawTrends(); if (v === 'usage-channels') drawU(); }, 150); });

/* ── 真实数据装载 ── */
async function fetchJson(url) {
  const r = await fetch(url, { headers: { 'cache-control': 'no-cache' } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error ?? (url + ' HTTP ' + r.status));
  return d;
}
async function loadConsoleData(force = null) {
  // force: null = 只读服务端快照（自动 60s）；'all' = 全局重查额度；providerId = 单渠道重查
  const [dash, usage, keysD, inbox, activity, dClient, dModel, dProvider, dDevice, dClientModel, devices] = await Promise.all([
    fetchJson('/internal/dashboard' + (force ? '?force=' + encodeURIComponent(force) : '')),
    fetchJson('/internal/usage?range=today&kind=served'), // 概览「今日网关」口径；请求明细由 LG（24h 混排）按需拉取
    fetchJson('/internal/keys'),
    fetchJson('/internal/inbox'),
    fetchJson('/internal/usage/activity'),
    fetchJson('/internal/usage/daily?groupBy=day,client,kind'),
    fetchJson('/internal/usage/daily?groupBy=day,model'),
    fetchJson('/internal/usage/daily?groupBy=day,provider,kind'),
    fetchJson('/internal/usage/daily?groupBy=day,device'),
    fetchJson('/internal/usage/daily?groupBy=day,client,model'),
    fetchJson('/internal/usage/devices'),
  ]);
  S = {
    generatedAt: new Date().toISOString(),
    providers: (dash.providers ?? []).map((p) => ({ ...p, name: p.displayName ?? p.name })),
    events: dash.events ?? [],
    fallbacksToday: dash.fallbacksToday ?? null,
    features: dash.features ?? null,
    today: { totals: usage.totals ?? {}, buckets: usage.buckets ?? [], modelNames: usage.modelNames ?? null },
    logs: usage.logs ?? [],
    keys: keysD.keys ?? [],
    agents: keysD.agents ?? [],
    topology: keysD.topology ?? {},
    inbox: inbox.items ?? [],
    inboxProviders: inbox.providers ?? {},
    activity: { from: activity.from, to: activity.to, days: activity.days ?? [], stats: activity.stats ?? null },
    dayClient: dClient.rows ?? [],
    dayModel: dModel.rows ?? [],
    dayProvider: (dProvider.rows ?? []).map((r) => ({ ...r, providerId: r.providerId ?? r.provider })).filter((r) => r.providerId), // API 字段名 provider；无渠道归属且零 token 的历史行不展示
    dayDevice: dDevice.rows ?? [],
    clientModel: dClientModel.rows ?? [],
    devices: devices.devices ?? [],
  };
  INBOX = { csrf: inbox.csrf ?? '', providers: inbox.providers ?? {}, rollback: inbox.rollback ?? null };
}
function applyData() {
  NOW = new Date(S.generatedAt);
  TODAY = dayKey(NOW);
  PROV = Object.fromEntries(S.providers.map((p) => [p.id, p]));
  AGENTS = Object.fromEntries((S.agents || []).map((a) => [a.app, a]));
  for (const [k, v] of Object.entries(S.today?.modelNames ?? {})) MODEL_NAMES.set(k, v);
  SRC_COLOR = rankColors(S.dayClient, 'client');
  MODEL_COLOR = rankColors(S.dayModel, 'model');
  PROV_COLOR = rankColors(S.dayProvider, 'providerId');
  rebuildProvOfModel();
  pending = S.inbox.filter((i) => i.status === 'pending' || i.status === 'failed').length;
}
(async () => {
  // 数据未到 → 各视图按自身布局渲染骨架（render 内部各 view 的 !S 分支）
  render();
  const wireAuto = () => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) simulateRefresh(true); });
    document.querySelector('#auto-btn')?.addEventListener('click', () => { autoEnabled = !autoEnabled; updateAutoBtn(); });
  };
  try {
    await loadConsoleData(); applyData(); markLive(); startAutoRefresh(); wireAuto();
  } catch (e) {
    BOOT_ERR = e.message; console.error(e); render();
    // 骨架保留、顶部报错，稍后自动重试
    setTimeout(async () => {
      try { await loadConsoleData(); applyData(); BOOT_ERR = ''; startAutoRefresh(); wireAuto(); } catch {}
      render();
    }, 5000);
    return;
  }
  render();
})();
</script>
